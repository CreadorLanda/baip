# Roadmap structure — language-neutral.
#
# This file defines WHAT exists (stages, tasks, folders). All human-readable
# text lives in roadmap/i18n/<lang>.toml, keyed by the ids below.
#
# Ids are permanent: they are written into each GitHub issue as a hidden marker
# so `scripts/sync_issues.py` can find and update the issue later. Renaming an
# id makes the script create a new issue.

[[stage]]
id = "s1"
months = "1–3"
studies = "studies/stage-1-math"
projects = ["projects/01-math-from-scratch"]
tasks = [
  "vectors",
  "matrices",
  "linear-systems",
  "eigen-svd-pca",
  "derivatives",
  "gradient",
  "chain-rule",
  "gradient-descent",
  "probability-bayes",
  "distributions",
  "entropy-kl",
]

[[stage]]
id = "s2"
months = "4–6"
studies = "studies/stage-2-ml"
projects = ["projects/02-classic-ml"]
tasks = [
  "linear-regression",
  "logistic-regression",
  "train-test-split",
  "knn-naive-bayes",
  "trees-forests",
  "svm-clustering",
  "generalization",
]

[[stage]]
