# Português. Qualquer chave em falta usa o valor de en.toml.

[ui]
stage = "Etapa {n}"
months = "meses {months}"
epic_title = "[S{n}] {title} ({months})"
task_title = "[S{n}] {title}"
test_title = "[S{n}] Teste final — {title}"
part_of = "Parte de {epic}"
folders = "Pastas"
tasks = "Tasks"
study = "🎯 Estudar"
practice = "🛠️ Praticar"
done_when = "✅ Fecha quando"
task_done = [
  "Nota em `{studies}/` a explicar com as tuas palavras",
  "Código mínimo em {projects} (quando aplicável)",
  "Resumo curto em `notes/`, com link aqui",
]
epic_done = [
  "Todas as tasks fechadas",
  "Teste final passado",
  "Post em `blog/posts/`",
]
test_intro = "Só começa quando todas as tasks da etapa estiverem fechadas."
test_steps = [
  "Rever todas as notas em `{studies}/`",
  "Resolver sem consulta: {challenge}",
  "Explicar em voz alta ou escrever um post em `blog/posts/`",
  "Abaixo de 80%? Reabre as tasks fracas",
]
test_criterion = "**Critério:** consegues explicar a matemática **e** implementar uma versão simplificada."

[labels]
epic = "Issue de acompanhamento da etapa"
task = "Pequena unidade de estudo + prática"
test = "Teste final que fecha a etapa"
stage = "Etapa {n} — {title}"

# ─── Etapa 1 ────────────────────────────────────────────────────────────────
[stage.s1]
title = "Fundamentos matemáticos"
summary = "Álgebra linear, cálculo e probabilidade — a base para tudo o resto."
challenge = "álgebra linear + derivadas + Bayes + gradient descent"

[stage.s1.task.vectors]
title = "Vetores, escalares e produto escalar"
study = "vetores, soma, escala, dot = Σaᵢbᵢ = |a||b|cosθ, ortogonalidade"
practice = "implementar `dot` e `matmul` em Python puro (sem NumPy) e comparar com NumPy"

[stage.s1.task.matrices]
title = "Matrizes: multiplicação, transposta, identidade, inversa"
study = "matrizes, shapes, transposta, identidade, inversa 2×2"
practice = "implementar transposta e inversa 2×2, com testes"

[stage.s1.task.linear-systems]
title = "Sistemas lineares, transformações e espaços vetoriais"
study = "Ax = b, transformações lineares, base, dimensão"
practice = "resolver 2 sistemas à mão e depois em código"

[stage.s1.task.eigen-svd-pca]
title = "Autovalores, autovetores, SVD e PCA"
study = "det(A − λI) = 0, SVD, intuição do PCA"
practice = "PCA simples num dataset 2D"

[stage.s1.task.derivatives]
title = "Funções, limites e derivadas"
study = "limite, definição de derivada, regras de derivação"
practice = "derivada numérica vs analítica"

[stage.s1.task.gradient]
title = "Derivadas parciais e gradiente"
study = "∂f/∂x, vetor gradiente, direção de maior subida"
practice = "desenhar o campo gradiente de f(x, y) = x² + y²"

[stage.s1.task.chain-rule]
title = "Regra da cadeia e Jacobiano"
study = "regra da cadeia uni e multivariável, Jacobiano"
practice = "backprop de um neurónio à mão"

[stage.s1.task.gradient-descent]
title = "Otimização e gradient descent"
study = "gradient descent, learning rate, mínimos locais vs globais"
practice = "gradient descent em f(x) = x² até convergir"

[stage.s1.task.probability-bayes]
title = "Probabilidade, probabilidade condicional e Bayes"
study = "P(A|B), teorema de Bayes"
practice = "exercício de filtro de spam com Bayes"

[stage.s1.task.distributions]
title = "Variáveis aleatórias, distribuições, média/variância/esperança"
study = "discretas vs contínuas, distribuição normal, esperança"
practice = "analisar um dataset: média e variância"

[stage.s1.task.entropy-kl]
title = "Entropia, cross-entropy e divergência KL"
study = "H, CE, KL, porque é que a cross-entropy serve de loss"
practice = "calcular CE e KL num exemplo de 3 classes"

# ─── Etapa 2 ────────────────────────────────────────────────────────────────
[stage.s2]
title = "Machine Learning"
summary = "Machine learning clássico, implementado do zero."
challenge = "treinar, avaliar e diagnosticar overfitting num dataset tabular"

[stage.s2.task.linear-regression]
title = "Regressão linear"
study = "hipótese, MSE, equação normal vs gradient descent"
practice = "implementação do zero"

[stage.s2.task.logistic-regression]
title = "Regressão logística e loss"
study = "sigmoid, binary cross-entropy, fronteira de decisão"
practice = "implementar e reportar métricas"

[stage.s2.task.train-test-split]
title = "Gradient descent + divisão treino/teste"
study = "batch GD vs SGD, porque separamos dados"
practice = "treinar e avaliar com divisão 80/20"

[stage.s2.task.knn-naive-bayes]
title = "k-NN e Naive Bayes"
study = "métricas de distância, escolha do k, hipótese do naive Bayes"
practice = "implementação simples de k-NN"

[stage.s2.task.trees-forests]
title = "Árvores de decisão e random forests"
study = "splits, Gini / entropia, ensembles"
practice = "treinar uma árvore e uma floresta e comparar"

[stage.s2.task.svm-clustering]
title = "SVM e clustering"
study = "margem, kernels, k-means"
practice = "k-means do zero"

[stage.s2.task.generalization]
title = "Overfitting, bias/variance, regularização, CV e métricas"
study = "L1/L2, k-fold cross-validation, precision/recall/F1"
practice = "experiência de regularização"

# ─── Etapa 3 ────────────────────────────────────────────────────────────────
[stage.s3]
title = "Deep Learning"
summary = "PyTorch, MLPs, CNNs e RNNs — mais o teu próprio autograd e framework de redes."
challenge = "explicar backprop e treinar uma CNN ou RNN de ponta a ponta"

[stage.s3.task.pytorch-basics]
title = "PyTorch: tensores, autograd, dataloaders"
study = "operações com tensores, autograd, Dataset / DataLoader"
practice = "notebook de exercícios com tensores"

[stage.s3.task.perceptron-mlp]
title = "Perceptron, MLP e ativações"
study = "perceptron, MLP, ReLU / sigmoid / tanh"
practice = "MLP pequeno no MNIST"

[stage.s3.task.cnn]
title = "CNN: convolução, pooling, feature maps"
study = "kernels, stride, padding, pooling"
practice = "CNN de uma camada do zero"

[stage.s3.task.image-classifier]
title = "Classificador de imagens"
study = "loop de treino, data augmentation, avaliação"
practice = "classificador completo + post no blog"

[stage.s3.task.rnn-embeddings]
title = "RNN / LSTM / GRU e embeddings"
study = "sequências, vanishing gradients, embeddings"
practice = "classificador ou gerador de texto"

# ─── Etapa 4 ────────────────────────────────────────────────────────────────
[stage.s4]
title = "Transformers"
summary = "Da attention ao teu próprio modelo de linguagem pequeno."
challenge = "derivar a attention de cabeça e gerar texto com o teu modelo"

[stage.s4.task.attention]
title = "Attention: Q / K / V"
study = "softmax(QKᵀ/√dₖ)V, self-attention"
practice = "attention mínima em NumPy"

[stage.s4.task.transformer-block]
title = "Bloco Transformer"
study = "multi-head attention, positional encoding, FFN, LayerNorm, residuais"
practice = "forward de um único bloco"

[stage.s4.task.tiny-llm]
title = "Tiny LLM: tokenizer → treino"
study = "BPE simples, embeddings, loss de language model, sampling"
practice = "treinar um LM pequeno e gerar texto"

# ─── Etapa 5 ────────────────────────────────────────────────────────────────
[stage.s5]
title = "LLM Engineering"
summary = "Tokenizers, fine-tuning e retrieval-augmented generation."
challenge = "fazer fine-tune de um modelo e um RAG que responde sobre os teus documentos"

[stage.s5.task.tokenizers-hf]
title = "Tokenizers, Hugging Face e datasets"
study = "BPE, SentencePiece, Hugging Face Hub, checkpoints"
practice = "treinar um tokenizer e carregar um modelo do Hugging Face"

[stage.s5.task.fine-tuning]
title = "Fine-tuning com LoRA / QLoRA"
study = "SFT, PEFT, quantização"
practice = "LoRA num modelo pequeno"

[stage.s5.task.rag]
title = "RAG: chunk → embed → retrieve"
study = "chunking, bases de dados vetoriais, reranking"
practice = "sistema RAG de ponta a ponta"

# ─── Etapa 6 ────────────────────────────────────────────────────────────────
[stage.s6]
title = "AI Agents"
summary = "Agentes que usam ferramentas, têm memória e planeiam."
challenge = "uma tarefa multi-passo com um agente que usa ferramentas"

[stage.s6.task.tool-calling]
title = "Tool calling e o loop do agente"
study = "function calling, o loop decisão → ferramenta → observação"
practice = "agente com 2 ferramentas"

[stage.s6.task.memory-planning]
title = "Memória, planeamento e multi-agente"
study = "memória, reflexão, passagem de tarefas entre agentes"
practice = "agente completo com memória e planeamento"

# ─── Etapa 7 ────────────────────────────────────────────────────────────────
[stage.s7]
title = "Multimodal AI"
summary = "Visão, áudio e vídeo — mais um orquestrador que encaminha entre eles."
challenge = "um pipeline utilizador → conductor → ferramentas"

[stage.s7.task.vision]
title = "Visão: ViT e CLIP"
study = "patches, embeddings, aprendizagem contrastiva"
practice = "demo zero-shot com CLIP"

[stage.s7.task.audio]
title = "Áudio: speech-to-text e text-to-speech"
study = "Whisper, embeddings de áudio"
practice = "pipeline STT + TTS"

[stage.s7.task.conductor]
title = "Conductor model"
study = "encaminhar entre modelos de imagem / vídeo / texto"
practice = "um conductor que escolhe a ferramenta certa"

# ─── Etapa 8 ────────────────────────────────────────────────────────────────
[stage.s8]
title = "AI Systems"
summary = "GPUs, otimização de inferência e serving distribuído."
challenge = "otimizar inferência e provar com medições"

[stage.s8.task.gpu-cuda]
title = "GPU / CUDA básico"
study = "threads, kernels, hierarquia de memória"
practice = "kernel de soma de vetores"

[stage.s8.task.optimization]
title = "Otimização: quantização, KV cache, batching"
study = "quantização, pruning, distillation"
practice = "benchmark de latência"

[stage.s8.task.distributed-serving]
title = "Treino distribuído e servidores de inferência"
study = "paralelismo de dados vs de modelo"
practice = "servir um modelo localmente"

# ─── Etapa 9 ────────────────────────────────────────────────────────────────
[stage.s9]
title = "Research Mode"
summary = "Ler, reproduzir, pesquisar."
challenge = "defender a tua própria pesquisa"

[stage.s9.task.paper-routine]
title = "Rotina: 2–4 papers por semana"
study = "problema → método → experiências"
practice = "3 reviews em `papers/`"

[stage.s9.task.reproduce-paper]
title = "Reproduzir um paper"
study = "reimplementar resultados publicados"
practice = "um repositório reproduzível"

[stage.s9.task.own-research]
title = "Pesquisa própria"
study = "hipótese → experiências → ablations"
practice = "publicar os resultados"
