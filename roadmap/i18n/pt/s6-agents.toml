  "Implementa plan-then-execute (o modelo escreve um plano numerado e depois executa cada passo) e compara com o loop simples no teu benchmark de 10 tarefas.",
  "Junta um passo de reflexão antes da resposta final; mede a mudança na taxa de sucesso e os tokens extra que custa.",
  "Constrói um sistema com 2 agentes (orquestrador + worker) para uma tarefa de vários passos e regista as passagens de tarefa.",
