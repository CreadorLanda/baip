  "Mostra o que acontece ao gradient descent quando uma feature está em metros e outra em milímetros, e corrige com standardization.",
  "Ajusta polinómios de grau 1, 3 e 15 a 20 pontos com ruído de sin(x) e desenha-os (primeiro contacto com overfitting).",
  "Compara o teu R² com o de `sklearn.linear_model.LinearRegression`.",
]
check = [
  "Explicar porque é que os erros vão ao quadrado em vez de usar valor absoluto, e o que muda se usares valor absoluto",
  "Explicar quando é que a equação normal é má ideia",
  "Interpretar um coeficiente: \"+1 na feature k muda a previsão em w_k\"",
]

