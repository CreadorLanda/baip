summary = "Machine learning clássico implementado do zero — e os hábitos (splits, métricas, validação) de que todas as etapas seguintes dependem."
exam = [
  "Num dataset tabular (ex.: Titanic), construir um pipeline completo a partir de um ficheiro vazio: split, pré-processamento sem leakage, 3 modelos, cross-validation com 5 folds",
  "Diagnosticar overfitting a partir das learning curves e corrigi-lo",
  "Explicar o trade-off entre precision e recall com os teus próprios resultados",
  "Derivar no papel o gradiente da loss da regressão logística",
]

[task.linear-regression]
goals = [
  "Implementar regressão linear com a equação normal e com gradient descent",
  "Explicar o que a MSE mede e porque é ao quadrado",
  "Avaliar um modelo de regressão com MSE e R²",
  "Explicar porque é que o feature scaling importa para o gradient descent",
]
exercises = [
