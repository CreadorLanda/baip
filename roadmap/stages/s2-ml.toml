[[task]]
id = "trees-forests"
title = "Decision trees & random forests"
topics = [
  "Recursive splitting",
  "Impurity: Gini and entropy",
  "Information gain",
  "Depth, min samples per leaf, pruning",
  "Bagging and bootstrap samples",
  "Random forests: feature subsampling",
  "Feature importance",
  "Gradient boosting (intuition)",
]
example = '''
```
Node with 10 samples: 6 yes, 4 no
Gini = 1 − (0.6² + 0.4²) = 0.48

Split on "age < 30":
  left : 4 yes, 0 no   →  Gini = 0
  right: 2 yes, 4 no   →  Gini = 1 − (1/3)² − (2/3)² ≈ 0.444

Weighted Gini = 0.4·0 + 0.6·0.444 ≈ 0.267    → gain = 0.48 − 0.267 = 0.213
```'''

