[[task]]
id = "linear-regression"
title = "Linear regression"
topics = [
  "Supervised learning setup: features X, target y",
  "Hypothesis ŷ = Xw + b",
  "Mean squared error (MSE) loss",
  "Closed form: normal equation w = (XᵀX)⁻¹Xᵀy",
  "Solving with gradient descent",
  "Feature scaling (standardization)",
  "R² score",
  "Polynomial features",
]
example = '''
```
Data:  x = [1, 2, 3],   y = [2, 4, 6.5]

X = [[1, 1],        ← first column of 1s = bias
     [1, 2],
     [1, 3]]

w = (XᵀX)⁻¹ Xᵀ y   →   b ≈ −0.33,  slope ≈ 2.25
Prediction for x = 4:   −0.33 + 2.25·4 ≈ 8.67
```'''

[[task]]
id = "logistic-regression"
title = "Logistic regression & log loss"
topics = [
  "Binary classification",
  "Sigmoid function as a probability",
  "Decision boundary w·x + b = 0",
  "Binary cross-entropy (log loss)",
  "Gradient of the log loss: (ŷ − y)·x",
  "Choosing a threshold",
  "Softmax regression (multi-class)",
  "Confusion matrix, accuracy, precision, recall",
]
example = '''
```
w = [2, −1],   b = −1,   x = [1, 0.5]

z = 2·1 − 1·0.5 − 1 = 0.5
ŷ = σ(0.5) ≈ 0.622          → predict class 1 (threshold 0.5)

If true y = 1:  loss = −log(0.622)     ≈ 0.474
If true y = 0:  loss = −log(1 − 0.622) ≈ 0.974
```'''

[[task]]
id = "train-test-split"
title = "Gradient descent variants + train/validation/test split"
topics = [
  "Generalization",
  "Training, validation and test sets",
  "Data leakage",
  "Batch, stochastic and mini-batch gradient descent",
  "Epochs and iterations",
  "Learning curves",
  "Stratified splits",
  "Random seeds and reproducibility",
]
example = '''
```python
rng = np.random.default_rng(42)
idx = rng.permutation(len(X))
cut = int(0.8 * len(X))
train, test = idx[:cut], idx[cut:]

# fit the scaler on TRAIN only — fitting on all data leaks test information
mu, sd = X[train].mean(0), X[train].std(0)
X_train = (X[train] - mu) / sd
X_test  = (X[test]  - mu) / sd
```'''

