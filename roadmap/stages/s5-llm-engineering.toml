[[task]]
id = "tokenizers-hf"
title = "Tokenizers, Hugging Face & datasets"
topics = [
  "Tokenization algorithms: BPE, WordPiece, Unigram / SentencePiece",
  "Special tokens, padding and attention masks",
  "Vocabulary-size trade-offs",
  "Hugging Face Hub: models, datasets, model cards",
  "transformers: AutoTokenizer, AutoModel, pipeline",
  "datasets: load, map, filter, streaming",
  "Checkpoints, safetensors and dtypes (fp32 / fp16 / bf16)",
  "Chat templates",
]
example = '''
```python
from transformers import AutoTokenizer, AutoModelForCausalLM

name = "HuggingFaceTB/SmolLM2-135M"
tok = AutoTokenizer.from_pretrained(name)
model = AutoModelForCausalLM.from_pretrained(name)

ids = tok("Learning AI in public", return_tensors="pt")
print(tok.convert_ids_to_tokens(ids["input_ids"][0]))
out = model.generate(**ids, max_new_tokens=20)
print(tok.decode(out[0]))
```'''

[[task]]
id = "fine-tuning"
title = "Fine-tuning with LoRA / QLoRA"
topics = [
  "Pre-training vs fine-tuning",
  "Supervised fine-tuning (SFT) on instruction data",
  "Full fine-tuning vs parameter-efficient fine-tuning (PEFT)",
  "LoRA: low-rank update W + BA",
  "QLoRA: 4-bit base model + LoRA",
  "Quantization basics: int8, 4-bit (NF4)",
  "Overfitting and catastrophic forgetting",
  "Evaluating a fine-tuned model",
]
example = '''
```
LoRA on a frozen 4096×4096 weight W:
ΔW = B·A,    B: 4096×r,   A: r×4096,   r = 8

full fine-tuning:  4096·4096  = 16 777 216 trainable params
LoRA:              2·4096·8   =     65 536 trainable params   (≈ 0.4%)

forward:  y = W·x + (α / r) · B·(A·x)
```'''

[[task]]
id = "rag"
title = "RAG: chunk → embed → retrieve → generate"
topics = [
  "Why RAG: grounding, freshness, private data",
  "Chunking strategies: size, overlap, document structure",
  "Embedding models and vector similarity",
  "Vector stores and approximate nearest-neighbour search",
  "Retrieval: dense, sparse (BM25), hybrid",
  "Reranking with cross-encoders",
  "Prompt construction with citations",
  "Evaluating RAG: retrieval recall, answer faithfulness",
]
example = '''
```
1. Chunk     docs → 500-token chunks with 50-token overlap
2. Embed     each chunk → vector (e.g. 384 dimensions)
3. Index     store the vectors (NumPy, FAISS, Chroma…)
4. Retrieve  embed the question → top-k chunks by cosine similarity
5. Rerank    a cross-encoder scores (question, chunk) pairs → keep top 3
6. Generate  "Answer using ONLY the context below and cite [chunk-id]…"
```'''
