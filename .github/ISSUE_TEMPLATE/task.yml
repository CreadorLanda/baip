name: Study task
description: A small unit of study + practice that belongs to a stage.
title: "[S?] "
labels: ["task"]
body:
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - "1 — Math foundations"
        - "2 — Machine Learning"
        - "3 — Deep Learning"
        - "4 — Transformers"
        - "5 — LLM Engineering"
        - "6 — AI Agents"
        - "7 — Multimodal AI"
        - "8 — AI Systems"
        - "9 — Research Mode"
    validations:
      required: true
  - type: textarea
    id: topics
    attributes:
      label: 📚 Topics
      description: The concepts covered, one per line (in English).
      placeholder: |
        - Dot product
        - Cosine similarity
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: 🎯 By the end you can
      description: Concrete things you will be able to do.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: 💡 Worked example
      description: A small solved example that shows the idea.
  - type: textarea
    id: exercises
    attributes:
      label: 🛠️ Exercises
      description: Problems to solve, with answers where possible.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: 🧠 Self-check — you've got it when you can
      value: |
        - [ ]
  - type: checkboxes
    id: done
    attributes:
      label: ✅ Done when
      options:
        - label: Note in `studies/stage-N-.../` explaining it in your own words
        - label: Minimal code in `projects/` (when applicable)
        - label: Short summary in `notes/`, linked here
  - type: input
    id: epic
    attributes:
      label: Part of
      description: The stage epic, e.g. `#1`.
