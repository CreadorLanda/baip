name: roadmap

on:
  pull_request:
    paths: ["roadmap/**", "scripts/sync_issues.py"]
  push:
    branches: [main]
    paths: ["roadmap/**", "scripts/sync_issues.py"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/sync_issues.py --check
      - run: python3 scripts/sync_issues.py --preview > /dev/null
